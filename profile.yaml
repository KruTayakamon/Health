# โปรไฟล์ของครูทยากมล — ทุก agent อ่านไฟล์นี้ก่อนตอบเสมอ
# อัปเดต: 2026-11-03

identity:
  name: ครูทยากมล
  sex: female
  age: 35
  height_cm: 166
  occupation: ครู (นั่ง/ยืนสอน เคลื่อนไหวน้อย)
  gym_member: true

weight:
  before_glp1_kg: 117
  start_kg: 115          # วันเริ่มระบบ 2026-11-03
  record_low_kg: 92      # เคยทำได้เมื่อ ~7 ปีก่อน ด้วยการออกกำลังกาย -> หลักฐานว่าทำสำเร็จได้
  ultimate_goal_kg: 70   # เป้าปลายทาง *ไม่ใช่* เป้าที่ใช้คุยรายวัน

medical:
  conditions: [PCOS]
  medications:
    - metformin 1 เม็ด/วัน
    - ยาลดไขมัน 1 เม็ด/วัน
    - Mounjaro (tirzepatide) 10 mg pen แบ่งใช้ (~5 mg/สัปดาห์) ตามคำแนะนำแพทย์ — กำลังจะหยุดเพราะค่าใช้จ่าย
  glp1_history: "2.5 mg x 2 เดือน น้ำหนักไม่ลดแต่คุมการกินได้ดีขึ้น; ~5 mg ลดได้ ~2 กก. (117->115) ความหิวลดเล็กน้อย"
  notes:
    - PCOS = ดื้ออินซูลิน -> ลดช้ากว่าค่าเฉลี่ยได้ ตั้งเป้าปลายล่าง และเวทเทรนนิ่งช่วยมากเป็นพิเศษ
    - การหยุด Mounjaro ต้องแจ้งแพทย์ ห้ามหยุด metformin เอง

energy:
  bmr_kcal: 1850                 # Mifflin-St Jeor
  tdee_kcal_estimate: 2300-2450  # นั่งทำงาน + ยิม 2-3 วัน
  tdee_adaptive_kcal: null       # ระบบจะคำนวณจากข้อมูลจริงหลัง 3 สัปดาห์

daily_targets:
  kcal_normal_day: 1650-1750
  kcal_social_day: 2000-2200     # วันบุฟเฟ่ต์/กินข้าวกับเพื่อน (ไม่เกิน 2 วัน/สัปดาห์)
  kcal_weekly_budget: 12250      # 7 x 1750 — ใช้ "งบรายสัปดาห์" ไม่ใช่รายวันอย่างเดียว
  kcal_floor: 1300               # ห้ามต่ำกว่านี้ (Safety Guardian จะหยุด)
  protein_g: 130-150
  fiber_g: 25-30
  carbs_g: 120-170               # ปานกลางสำหรับ PCOS ไม่ใช่ keto
  water_l: 2.5-3
  drinks_per_day: 1              # โกโก้/มัทฉะชงเอง 1 แก้ว อยู่ในแผน ไม่ใช่ของแถม

weekly_targets:
  expected_loss_kg: 0.4-0.7      # หลังสัปดาห์ที่ 2; สัปดาห์ 1-2 อาจเห็น 1.5-2.5 (น้ำ)
  max_safe_loss_pct: 1.5
  gym_sessions: 2                # สัปดาห์ 1-2 = 2 ครั้ง, สัปดาห์ 3+ = 3 ครั้ง
  walks: 3
  logging_adherence_pct: 90
  buffet_or_social_meals_max: 2

preferences:
  loves: [หมูกรอบ, อาหารไทย, โกโก้, มัทฉะ, เนื้อ, ชาบูบุฟเฟ่ต์, อาหารญี่ปุ่น]
  can_make_at_home: [โกโก้, มัทฉะนมสด]
  cooks: false
  eats_with: มักกินกับแม่ตอนเย็น
  social: ขี้เหงา อยากเจอเพื่อน ชอบนัดกินข้าว -> ให้ "มื้อสังคม" เป็นส่วนหนึ่งของแผน ไม่ใช่ข้อยกเว้น
  no_late_night: true
  no_alcohol: true
  allergies: []
  tried_before: [IF (ทำได้ชั่วคราว), GLP-1 โดสต่ำ]

mindset:
  confidence: low  # "ไม่กล้าตั้งเป้า ไม่กล้าวางแผน กลัวมาก เพราะไม่เคยสำเร็จ"
  coach_rules:
    - ระบบวางแผนให้ คุณแค่รายงาน — ไม่ขอให้คุณตัดสินใจเรื่องแผนเอง
    - 4 สัปดาห์แรกวัดผลด้วย "พฤติกรรม" ไม่ใช่ตัวเลขน้ำหนัก
    - เป้าที่พูดถึงคือเป้าถัดไปอันเดียว (110) ไม่พูดถึง 70 เว้นแต่คุณถาม
    - ย้ำหลักฐาน: เคยลดถึง 92 มาแล้วด้วยยิม = วิธีนี้เคยได้ผลกับร่างกายนี้
    - ไม่มีคำว่า "โกง/พัง/ล้มเหลว" มีแต่ "ข้อมูล" และ "มื้อถัดไป"
